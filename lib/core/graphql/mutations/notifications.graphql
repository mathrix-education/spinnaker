mutation DismissNotification( $id: ID!){
  dismissNotification(id: $id){
    ...BasicNotification
  }
}

mutation DismissAllNotifications($page: Int!, $first: Int!){
  dismissAllNotifications(first: $first, page: $page){
    paginatorInfo{
      count
      currentPage
      firstItem
      hasMorePages
      lastItem
      lastPage
      perPage
      total
    }
    data{...BasicNotification}
  }
}
