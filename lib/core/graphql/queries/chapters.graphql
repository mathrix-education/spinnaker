fragment BasicChapter on Chapter {
  id
  name
  slug
  order
  visible
  price
  available
  owned
}

fragment ChapterWithInfos on Chapter {
  ...BasicChapter
  theme{
    id
    discipline {
      ...BasicDiscipline
    }
    grade {
      ...BasicGrade
    }
  }
}

query ReadChapterNotions($id: ID!) {
  readChapter(id: $id) {
    notions {
      ...BasicNotion
    }
    summary {
      ...BasicNotion
    }
  }
}

query ReadChapterBySlugs($gradeSlug: String!, $disciplineSlug: String!, $chapterSlug: String!, $redactor: Boolean!){
  readChapter(gradeSlug: $gradeSlug, disciplineSlug: $disciplineSlug, chapterSlug: $chapterSlug) {
    ...BasicChapter
    theme{
      ...BasicTheme
      discipline {
        ...BasicDiscipline
      }
      chapters {
        ...BasicChapter
      }
      grade {
        ...BasicGrade
      }
    }
#    notions { TODO
#      ...NotionMixed
#    }
    summary {
      ...BasicNotion
      courses {
        ...BasicCourse
        interaction {
          ...BasicInteraction
        }
      }
    }
    flashcards {
      ...BasicFlashcard
      interaction {
        ...BasicInteraction
      }

    }
    exams {
      ...BasicExam
      interaction {
        ...BasicInteraction
      }
      labels @include(if: $redactor){
        ...BasicLabel
      }
    }
  }
}


