fragment BasicVote on Vote {
  id
  value
  created_at
  updated_at
}

mutation upsertVote($input: CreateVote!){
  upsertVote(input: $input){
    ...BasicVote
    comment{
      ...BasicComment
    }
  }
}

mutation deleteVote($commentId: ID!){
  deleteVote(comment_id: $commentId){
    id
    comment{
      ...BasicComment
    }
  }
}
