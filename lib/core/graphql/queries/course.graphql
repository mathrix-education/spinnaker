fragment BasicCourse on Course {
  id
  name
  slug
  seo_keywords
  seo_index
  seo_title
  seo_description
  order
  visible
  premium
  updated_at
  frozen_at
  owned
  protected
}

fragment CourseWithContent on Course {
  ...BasicCourse
  content
  interaction {
    ...BasicInteraction
  }
}

query ReadCourse($id: ID!, $redactor: Boolean!) {
  readCourse(id: $id) {
    ...CourseWithContent
    labels @include(if: $redactor) {
      ...BasicLabel
    }
    notes @include(if: $redactor){
      ...BasicNote
    }
    notion {
      ...CourseNotion
    }
  }
}

query ReadCourseInteraction($id: ID!){
  readCourse(id: $id){
    interaction{
      ...BasicInteraction
    }
  }
}

query readCourseComments($id: ID!){
  readCourse(id: $id){
    id
    comments{
      ...BasicComment
    }
  }
}
