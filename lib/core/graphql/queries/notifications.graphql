fragment BasicCommentReply  on Comment{
  id
  content
  user {
    id
    username
  }
}

fragment BasicNotification on Notification{
  id
  ... on CommentReplyNotification {
    id
    type
    data{
      user_comment{
        ...BasicCommentReply
      }
      new_comment{
        ...BasicCommentReply
        commentable{
          ... on Course {
            id
            slug
            notion{
              id
              chapter{
                id
                slug
                theme{
                  id
                  discipline{
                    id
                    slug
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  updated_at
  created_at
  read_at
}


query ReadNotifications($page: Int!, $first: Int!) {
  me {
    id
    notifications(first: $first, page: $page) {
      data {
        ...BasicNotification
      }
      paginatorInfo {
        ...PaginatorInfo
      }
    }
  }
}

