query Search($query: String!, $gradeId: ID!) {
  searchChapters(query: $query, first: 10, grade_id: $gradeId) {
    data {
      ...BasicChapter
      theme{
        id
        grade {
          ...BasicGrade
        }
        discipline {
          ...BasicDiscipline
        }
      }
    }
  }
  searchCourses(query: $query, first: 10, grade_id: $gradeId) {
    data {
    ...BasicCourse
      notion {
        chapter {
          ...BasicChapter
          theme{
            id
            grade {
              ...BasicGrade
            }
            discipline {
              ...BasicDiscipline
            }
          }
        }
      }
    }
  }
}
