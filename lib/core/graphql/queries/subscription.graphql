query ReadUserSubscriptions {
  me{
    id
    subscriptions{
      ...BasicSubscription
    }
  }
}

fragment BasicInvoice on Invoice {
  id
  amount_paid
  hosted_invoice_url
  invoice_pdf
  payment_intent {
    status
    client_secret
  }
  number
  status
}

fragment BasicSubscription on Subscription_ {
  id
  plan
  customer_id
  status
  current_period_start
  current_period_end
  latest_invoice {
    ...BasicInvoice
  }
}



