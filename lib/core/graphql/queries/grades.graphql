fragment BasicGrade on Grade {
  id
  name
  order
  slug
  visible
}

fragment GradeWithDiscipline on Grade{
  ...BasicGrade
  disciplines{
    ...BasicDiscipline
  }
}

query ListGrades {
  listGrades {
    ...BasicGrade
  }
}

query ReadGradeBySlug($slug: String!) {
  readGrade(slug: $slug) {
    ...GradeWithDiscipline
    themes {
      id
      visible
      discipline {
        id
      }
    }
  }
}

