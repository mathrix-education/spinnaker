name: mathrix_education_app
description: The Mathrix Education Application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

# Tracked by: https://github.com/flutter/flutter/issues/62240#issuecomment-663978057
#dependency_overrides:
#  analyzer: '0.39.14'

dependencies:
  graphql_flutter: ^3.0.0
  artemis: '>=5.0.0 <6.0.0'
  flutter:
    sdk: flutter
  shared_preferences: '>=0.5.10 <2.0.0'
  json_serializable: ^3.0.0
  equatable: ^1.0.0
  meta: '>=1.0.0 <2.0.0' # only if you have non nullable fields
  gql: '>=0.7.3 <1.0.0'
  flutter_form_builder: ^3.13.3
  provider: ^4.3.2
  cupertino_icons: ^0.1.3
  catex: ^0.0.1+6
  youtube_player_flutter: ^7.0.0+7
  google_sign_in: ^4.5.3
  flutter_facebook_login: ^3.0.0
  flutter_keyboard_visibility: ^3.2.2
  flushbar: ^1.10.4
  vibration: ^1.4.0
  flip_card: ^0.4.4
  advance_pdf_viewer: ^1.2.0
  video_player: ^0.10.12
  flutter_tex: ^3.6.7
  progress_button: ^0.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^1.10.1
  flutter_launcher_icons: ^0.7.3


flutter:
  uses-material-design: true
  assets:
    - assets/disciplines/
    - assets/activities/
    - assets/trainings/
    - assets/icons/
    - assets/premium/
  fonts:
    - family: Open Sans
      fonts:
        - asset: fonts/OpenSans-Light.ttf
    - family: Poppins
      fonts:
        - asset:  fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/lumix/lumix-smile.png"