name: mathrix_education_app
description: The Mathrix Education Application

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

# Tracked by: https://github.com/flutter/flutter/issues/62240#issuecomment-663978057
#dependency_overrides:
#  analyzer: '0.39.14'

dependencies:
  graphql_flutter: ^3.0.0
  artemis: '>=5.0.0 <6.0.0'
  flutter:
    sdk: flutter
  shared_preferences: '>=0.5.10 <2.0.0'
  # GraphQ:
  json_serializable: ^3.0.0
  equatable: ^1.0.0
  meta: '>=1.0.0 <2.0.0' # only if you have non nullable fields
  gql: '>=0.7.3 <1.0.0'
  flutter_form_builder: ^3.13.3
  provider: ^4.3.2
  cupertino_icons: ^0.1.3
  catex: ^0.0.1+6
  youtube_player_flutter: ^7.0.0+7
  google_sign_in: ^4.5.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^1.10.1
  flutter_launcher_icons: ^0.7.3
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is included
  uses-material-design: true
  assets:
    - assets/disciplines/
    - assets/activities/
    - assets/trainings/
    - assets/icons/
  fonts:
    - family: Open Sans
      fonts:
        - asset: fonts/OpenSans-Light.ttf
    - family: Poppins
      fonts:
        - asset:  fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/lumix/lumix-smile.png"