query ReadChaptersInformations($id: ID){
    readChapter(id: $id) {
        name
        notions {
            name
            type
            courses {
                id
                name
                premium
                order
                interaction {
                    comprehension
                }
            }
            subjects {
                id
                name
                premium
                order
                exercises{
                    interaction{
                        score
                    }
                }
            }
        }
        flashcards {
            id
            name
            premium
            interaction {
                comprehension
            }
        }
        exams {
            id
            premium
            owned
            name
            duration
            interaction {
                score
                total
                comprehension
            }
        }
    }
}