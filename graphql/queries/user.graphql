fragment BasicUser on User {
  id
  username
  firstname
  lastname
  email
  created_at
  updated_at
  permissions
  premium
  statistics {
    interactions
    watchtime
  }
  premium_bypass
  trainings {
    id
  }
#  sessions {
#    chapter {
#      ...BasicChapter
#      theme{
#        id
#        grade {
#          ...BasicGrade
#        }
#      }
#    }
#    discipline {
#      ...BasicDiscipline
#    }
#  }
  grade{
    ...BasicGrade
  }
  trainings{
    id
  }
}

query me {
  me {
    ...BasicUser
  }
}

mutation UpdateMe($input: UpdateMe!){
  updateMe(input: $input) {
    ...BasicUser
  }
}


